name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DynamicQuery.sln

      - name: Build (Release)
        run: dotnet build DynamicQuery.sln -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test DynamicQuery.sln -c Release --no-build --verbosity normal
